<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADMIN RAHMAN</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      scroll-behavior:smooth;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:#060611;
      color:white;
      overflow-x:hidden;
    }

    body::before{
      content:'';
      position:fixed;
      width:500px;
      height:500px;
      background:#7b2ff7;
      filter:blur(180px);
      top:-200px;
      left:-100px;
      z-index:-1;
      opacity:.6;
    }

    body::after{
      content:'';
      position:fixed;
      width:400px;
      height:400px;
      background:#ff00c8;
      filter:blur(180px);
      bottom:-150px;
      right:-100px;
      z-index:-1;
      opacity:.5;
    }

    nav{
      width:100%;
      padding:20px 8%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:fixed;
      top:0;
      background:rgba(0,0,0,.2);
      backdrop-filter:blur(10px);
      z-index:999;
    }

    .logo{
      font-size:28px;
      font-weight:700;
      color:#c770ff;
    }

    nav ul{
      display:flex;
      gap:25px;
      list-style:none;
    }

    nav ul li a{
      text-decoration:none;
      color:white;
</html>
